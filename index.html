<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اطلب من السوبرماركت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  --bg: #eef3ef;
  --surface: #ffffff;
  --ink: #14302a;
  --muted: #5d7168;
  --line: #d9e3dc;
  --green: #0f7b4f;
  --green-ink: #ffffff;
  --gold: #e0a526;
  --gold-ink: #2a1d00;
  --danger: #b3261e;
  --chip: #e1ece5;
  --tile-l: 91%;
  --ok-bg: #d7f0e2; --ok-ink: #0b5a39;
  --low-bg: #fbeac2; --low-ink: #6b4a00;
  --out-bg: #e6e6e6; --out-ink: #4a4a4a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1b17; --surface: #172721; --ink: #e8f1ec; --muted: #9bb0a5;
    --line: #26392f; --green: #2fb57d; --green-ink: #06231a;
    --gold: #e8b23a; --gold-ink: #2a1d00; --danger: #ff8a80; --chip: #1f332a;
    --tile-l: 24%;
    --ok-bg: #1b4a36; --ok-ink: #aef0cf;
    --low-bg: #4d3b0c; --low-ink: #ffe29a;
    --out-bg: #3a3f3d; --out-ink: #c9d0cd;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1b17; --surface: #172721; --ink: #e8f1ec; --muted: #9bb0a5;
  --line: #26392f; --green: #2fb57d; --green-ink: #06231a;
  --gold: #e8b23a; --gold-ink: #2a1d00; --danger: #ff8a80; --chip: #1f332a;
  --tile-l: 24%;
  --ok-bg: #1b4a36; --ok-ink: #aef0cf;
  --low-bg: #4d3b0c; --low-ink: #ffe29a;
  --out-bg: #3a3f3d; --out-ink: #c9d0cd;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  font-size: 16px; line-height: 1.6;
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }

header { padding: 20px 0 8px; }
h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

.again {
  display: none; width: 100%; margin-top: 14px; padding: 12px 14px;
  background: var(--surface); border: 1.5px dashed var(--green); border-radius: 12px;
  text-align: right; font-weight: 600; color: var(--green);
}
.again.show { display: block; }
.again small { display: block; font-weight: 400; color: var(--muted); }

.search {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 12px 0 6px;
}
.search input[type="search"] {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--line);
  border-radius: 12px; background: var(--surface);
}
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 8px 16px; border-radius: 999px; border: 0;
  background: var(--chip); font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
.meta {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 4px 2px 2px; font-size: 14px; color: var(--muted);
}
.meta label { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 500; font-size: 14px; color: var(--ink); }
.meta input { width: 18px; height: 18px; accent-color: var(--green); }

.grid {
  list-style: none; margin: 10px 0 0; padding: 0;
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
}
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
}
.tile {
  position: relative; aspect-ratio: 1 / 1; display: grid; place-items: center;
  background: hsl(var(--h, 150) 40% var(--tile-l));
}
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .emoji { font-size: 64px; line-height: 1; }
.badge {
  position: absolute; top: 8px; inset-inline-start: 8px;
  padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
}
.badge.in  { background: var(--ok-bg);  color: var(--ok-ink); }
.badge.low { background: var(--low-bg); color: var(--low-ink); }
.badge.out { background: var(--out-bg); color: var(--out-ink); }
.card.out .tile .emoji, .card.out .tile img { filter: grayscale(1); opacity: .55; }
.card.out .name, .card.out .price { opacity: .6; }
.info { padding: 10px 10px 4px; flex: 1; }
.name { font-weight: 600; line-height: 1.35; }
.price { color: var(--muted); font-size: 14px; }
.act { padding: 6px 10px 10px; }
.add {
  width: 100%; background: var(--green); color: var(--green-ink); border: 0;
  border-radius: 10px; padding: 9px 12px; font-weight: 600;
}
.add:disabled { background: var(--out-bg); color: var(--out-ink); cursor: default; }
.stepper { display: flex; align-items: center; justify-content: space-between; }
.qbtn {
  width: 42px; height: 40px; border-radius: 10px; border: 1.5px solid var(--green);
  background: transparent; color: var(--green); font-size: 22px; line-height: 1;
}
.qty { min-width: 28px; text-align: center; font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }

.bar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 10;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
}
.bar button {
  display: flex; justify-content: space-between; align-items: center;
  width: 100%; max-width: 688px; margin: 0 auto; padding: 14px 18px;
  background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 14px;
  font-weight: 700; font-size: 17px;
}
.bar button:disabled { opacity: .45; cursor: default; }

.overlay {
  position: fixed; inset: 0; z-index: 20; display: none;
  background: rgba(8, 20, 15, .55);
}
.overlay.open { display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto;
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
}
@media (prefers-reduced-motion: no-preference) {
  .overlay.open .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
}
.sheet h2 { margin: 0 0 10px; font-size: 20px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.row.total { font-weight: 700; font-size: 18px; border-bottom: 0; padding-top: 12px; }
.sheet label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 15px; }
.field {
  width: 100%; padding: 11px 13px; border: 1.5px solid var(--line);
  border-radius: 10px; background: var(--bg);
}
.pay { display: flex; gap: 8px; }
.pay button {
  flex: 1; padding: 11px 8px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); font-weight: 600;
}
.pay button[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: var(--green-ink); }
.hint { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.err { color: var(--danger); font-size: 14px; margin: 8px 0 0; min-height: 1.2em; }
.send {
  width: 100%; margin-top: 8px; padding: 14px; border: 0; border-radius: 14px;
  background: var(--green); color: var(--green-ink); font-weight: 700; font-size: 17px;
}
a.send { display: block; text-align: center; text-decoration: none; }
.fallback { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
.link { background: none; border: 0; color: var(--muted); padding: 10px 0; width: 100%; }
.preview {
  white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 8px;
}
details { margin-top: 14px; color: var(--muted); font-size: 14px; }
summary { cursor: pointer; padding: 6px 0; }
.demo-note {
  margin: 18px 0 0; padding: 10px 12px; border-radius: 10px;
  background: var(--chip); font-size: 14px; color: var(--muted);
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="sub">اختر ما تريد، وسنجهّز الطلب قبل وصولك.</p>
    <button class="again" id="again" type="button"></button>
  </header>

  <div class="search">
    <input id="q" type="search" placeholder="ابحث عن منتج" aria-label="ابحث عن منتج" autocomplete="off">
    <div class="chips" id="chips" role="group" aria-label="الأقسام"></div>
    <div class="meta">
      <label><input type="checkbox" id="onlyIn"> المتوفر فقط</label>
      <span id="updated"></span>
    </div>
  </div>

  <ul class="grid" id="list"></ul>
  <p class="empty" id="empty" hidden>لا يوجد منتج بهذا الاسم. جرّب كلمة أخرى.</p>
</div>

<div class="bar">
  <button id="open" type="button" disabled>
    <span id="barCount">السلة فارغة</span>
    <span id="barTotal"></span>
  </button>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <h2 id="sheetTitle">طلبك</h2>
    <div id="lines"></div>

    <label for="name">الاسم</label>
    <input class="field" id="name" autocomplete="name" placeholder="مثال: محمد">

    <label for="car">وصف سيارتك</label>
    <input class="field" id="car" placeholder="مثال: لاندكروزر بيضاء، رقم 1234">
    <p class="hint">حتى يصل العامل إليك مباشرة.</p>

    <label>طريقة الدفع</label>
    <div class="pay" id="pay" role="group" aria-label="طريقة الدفع">
      <button type="button" data-v="تحويل" aria-pressed="true">تحويل</button>
      <button type="button" data-v="نقد" aria-pressed="false">نقد</button>
    </div>

    <label for="note">ملاحظات (اختياري)</label>
    <input class="field" id="note" placeholder="مثال: الحليب بارد من فضلك">

    <p class="err" id="err" role="alert"></p>
    <button class="send" id="send" type="button">أرسل الطلب عبر واتساب</button>
    <div class="fallback" id="fallback" hidden>
      <p class="hint">لم يفتح واتساب؟ اضغط الرابط، أو انسخ الطلب والصقه في المحادثة.</p>
      <a class="send" id="waLink" href="#" target="_blank" rel="noopener">افتح واتساب</a>
      <button class="link" id="copy" type="button">نسخ نص الطلب</button>
    </div>
    <button class="link" id="close" type="button">رجوع لإضافة منتجات</button>

    <details id="testBox">
      <summary>إعدادات التجربة</summary>
      <label for="wa">رقم واتساب المتجر (بصيغة دولية بدون +)</label>
      <input class="field" id="wa" inputmode="numeric" placeholder="مثال: 22200000000">
      <p class="hint">يظهر هذا الحقل فقط حتى يُحفظ رقم المتجر من «تعديل المتجر».</p>
      <div class="preview" id="preview"></div>
    </details>
  </div>
</div>

<script>
(function () {
  var S = JSON.parse($("state").textContent);
  var PRODUCTS = S.products;
  var STORE_WA = S.wa || "";
  var CURRENCY = "أوقية";
  var STOCK_LABEL = { "in": "متوفر", "low": "كمية محدودة", "out": "غير متوفر" };
  var cart = {};
  var cat = "الكل", term = "", pay = "تحويل", onlyIn = false;

  function $(id) { return document.getElementById(id); }
  function fmt(n) { return Number(n).toLocaleString("en") + " " + CURRENCY; }
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function byId(id) { return PRODUCTS.filter(function (p) { return p.id === id; })[0]; }
  function hue(s) { var h = 0, i; s = String(s || ""); for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function cats() {
    return ["الكل"].concat(PRODUCTS.reduce(function (a, p) {
      if (p.cat && a.indexOf(p.cat) < 0) a.push(p.cat); return a;
    }, []));
  }

  function totals() {
    var n = 0, t = 0;
    Object.keys(cart).forEach(function (k) {
      var p = byId(+k); if (!p) return;
      n += cart[k]; t += cart[k] * p.price;
    });
    return { n: n, t: t };
  }

  function renderChips() {
    var box = $("chips"); box.innerHTML = "";
    cats().forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = c;
      b.setAttribute("aria-pressed", String(c === cat));
      b.onclick = function () { cat = c; renderChips(); renderList(); };
      box.appendChild(b);
    });
  }

  function renderList() {
    var ul = $("list"); ul.innerHTML = "";
    var shown = PRODUCTS.filter(function (p) {
      return (cat === "الكل" || p.cat === cat) &&
             (!term || p.name.indexOf(term) >= 0) &&
             (!onlyIn || p.stock !== "out");
    });
    $("empty").hidden = shown.length > 0;
    shown.forEach(function (p) {
      var li = document.createElement("li");
      li.className = "card" + (p.stock === "out" ? " out" : "");
      var q = cart[p.id] || 0;

      var tile = document.createElement("div");
      tile.className = "tile"; tile.style.setProperty("--h", hue(p.cat));
      if (p.img) {
        var im = document.createElement("img");
        im.src = p.img; im.alt = p.name; im.loading = "lazy";
        tile.appendChild(im);
      } else {
        var em = document.createElement("span");
        em.className = "emoji"; em.setAttribute("aria-hidden", "true"); em.textContent = p.ico || "🛒";
        tile.appendChild(em);
      }
      var bd = document.createElement("span");
      bd.className = "badge " + p.stock; bd.textContent = STOCK_LABEL[p.stock];
      tile.appendChild(bd);
      li.appendChild(tile);

      var info = document.createElement("div"); info.className = "info";
      info.innerHTML = '<div class="name"></div><div class="price"></div>';
      info.querySelector(".name").textContent = p.name;
      info.querySelector(".price").textContent = fmt(p.price);
      li.appendChild(info);

      var act = document.createElement("div"); act.className = "act";
      if (p.stock === "out") {
        var d = document.createElement("button");
        d.type = "button"; d.className = "add"; d.disabled = true; d.textContent = "غير متوفر";
        act.appendChild(d);
      } else if (q === 0) {
        var a = document.createElement("button");
        a.type = "button"; a.className = "add"; a.textContent = "أضف";
        a.setAttribute("aria-label", "أضف " + p.name);
        a.onclick = function () { change(p.id, 1); };
        act.appendChild(a);
      } else {
        var st = document.createElement("div"); st.className = "stepper";
        var plus = document.createElement("button");
        plus.type = "button"; plus.className = "qbtn"; plus.textContent = "+";
        plus.setAttribute("aria-label", "زد " + p.name);
        plus.onclick = function () { change(p.id, 1); };
        var qs = document.createElement("span"); qs.className = "qty"; qs.textContent = q;
        var minus = document.createElement("button");
        minus.type = "button"; minus.className = "qbtn"; minus.textContent = "−";
        minus.setAttribute("aria-label", "أنقص " + p.name);
        minus.onclick = function () { change(p.id, -1); };
        st.appendChild(plus); st.appendChild(qs); st.appendChild(minus);
        act.appendChild(st);
      }
      li.appendChild(act);
      ul.appendChild(li);
    });
  }

  function renderBar() {
    var s = totals();
    $("open").disabled = s.n === 0;
    $("barCount").textContent = s.n === 0 ? "السلة فارغة" : "عرض الطلب (" + s.n + ")";
    $("barTotal").textContent = s.n === 0 ? "" : fmt(s.t);
  }

  function change(id, d) {
    var p = byId(id);
    if (!p || (p.stock === "out" && d > 0)) return;
    var q = (cart[id] || 0) + d;
    if (q <= 0) delete cart[id]; else cart[id] = q;
    renderList(); renderBar();
    if ($("overlay").classList.contains("open")) renderSheet();
  }

  function renderSheet() {
    var box = $("lines"); box.innerHTML = "";
    Object.keys(cart).forEach(function (k) {
      var p = byId(+k); if (!p) return;
      var r = document.createElement("div"); r.className = "row";
      var a = document.createElement("span"); a.textContent = p.name + " × " + cart[k];
      var b = document.createElement("span"); b.textContent = fmt(p.price * cart[k]);
      r.appendChild(a); r.appendChild(b); box.appendChild(r);
    });
    var t = document.createElement("div"); t.className = "row total";
    t.innerHTML = '<span>المجموع</span><span></span>';
    t.lastChild.textContent = fmt(totals().t);
    box.appendChild(t);
    updatePreview();
  }

  function buildMessage() {
    var lines = ["طلب جديد 🛒"];
    var name = $("name").value.trim(), car = $("car").value.trim(), note = $("note").value.trim();
    lines.push("الاسم: " + (name || "—"));
    lines.push("السيارة: " + (car || "—"));
    lines.push("");
    Object.keys(cart).forEach(function (k) {
      var p = byId(+k); if (!p) return;
      lines.push("• " + p.name + " × " + cart[k] + " = " + fmt(p.price * cart[k]));
    });
    lines.push("");
    lines.push("المجموع: " + fmt(totals().t));
    lines.push("الدفع: " + pay);
    if (note) lines.push("ملاحظات: " + note);
    return lines.join("\n");
  }

  function updatePreview() { $("preview").textContent = buildMessage(); }

  function openSheet() {
    $("overlay").classList.add("open");
    $("fallback").hidden = true;
    renderSheet();
    $("err").textContent = "";
  }
  function closeSheet() { $("overlay").classList.remove("open"); }

  function send() {
    var name = $("name").value.trim(), car = $("car").value.trim();
    if (!name) { $("err").textContent = "اكتب اسمك حتى نناديك عند التسليم."; $("name").focus(); return; }
    if (!car) { $("err").textContent = "صف سيارتك (اللون والنوع) ليصل إليك العامل."; $("car").focus(); return; }
    var num = (STORE_WA || $("wa").value).replace(/\D/g, "");
    if (!num) {
      $("err").textContent = "اكتب رقم واتساب المتجر في «إعدادات التجربة» لتجرّب الإرسال.";
      $("testBox").open = true; $("wa").focus(); return;
    }
    safeSet("sm_name", name); safeSet("sm_car", car);
    if (!STORE_WA) safeSet("sm_wa", $("wa").value);
    safeSet("sm_last", JSON.stringify(cart));
    var url = "https://wa.me/" + num + "?text=" + encodeURIComponent(buildMessage());
    $("waLink").href = url;
    $("fallback").hidden = false;
    $("err").textContent = "";
    try { window.open(url, "_blank"); } catch (e) {}
  }

  function setupAgain() {
    var raw = safeGet("sm_last"), last;
    try { last = raw ? JSON.parse(raw) : null; } catch (e) { last = null; }
    if (!last) return;
    var ok = {}, parts = [], total = 0, skipped = 0;
    Object.keys(last).forEach(function (k) {
      var p = byId(+k); if (!p) return;
      if (p.stock === "out") { skipped++; return; }
      ok[k] = last[k]; parts.push(p.name + " × " + last[k]); total += p.price * last[k];
    });
    if (!parts.length) return;
    var b = $("again");
    b.innerHTML = 'اطلب نفس طلبك السابق <small></small>';
    b.querySelector("small").textContent = parts.slice(0, 3).join("، ") +
      (parts.length > 3 ? "…" : "") + " — " + fmt(total) +
      (skipped ? " (" + skipped + " غير متوفر حالياً)" : "");
    b.classList.add("show");
    b.onclick = function () { cart = ok; renderList(); renderBar(); openSheet(); };
  }

  /* ================= ربط الأحداث ================= */
  $("q").oninput = function (e) { term = e.target.value.trim(); renderList(); };
  $("onlyIn").onchange = function (e) { onlyIn = e.target.checked; renderList(); };
  $("open").onclick = openSheet;
  $("close").onclick = closeSheet;
  $("overlay").onclick = function (e) { if (e.target === $("overlay")) closeSheet(); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  ["name", "car", "note"].forEach(function (id) { $(id).oninput = updatePreview; });
  $("pay").onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    pay = b.getAttribute("data-v");
    Array.prototype.forEach.call($("pay").children, function (x) {
      x.setAttribute("aria-pressed", String(x === b));
    });
    updatePreview();
  };
  $("send").onclick = send;
  $("copy").onclick = function () {
    var t = buildMessage(), btn = $("copy");
    function done() { btn.textContent = "تم النسخ ✓"; }
    function legacy() {
      var ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "تعذّر النسخ"; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, legacy);
    } else { legacy(); }
  };


  $("title").textContent = S.title || "اطلب وسيارتك في الطريق";
  document.title = S.title || "اطلب من السوبرماركت";
  $("name").value = safeGet("sm_name") || "";
  $("car").value = safeGet("sm_car") || "";
  $("wa").value = safeGet("sm_wa") || "";
  $("updated").textContent = S.updated || "";
  if (STORE_WA) $("testBox").hidden = true;

  renderChips(); renderList(); renderBar(); setupAgain();
})();
</script>
</body>
</html>
